<!DOCTYPE html>
<html>
<head>
    <title>Book System</title>
    <style>
        body {
            font-family: Arial;
            margin: 20px;
            background-color: #f4f4f4;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        form {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 12px;
            margin-right: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #333;
            color: white;
        }

        .message {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Book Form</h2>

    <form method="POST">
	<h3 class="message">{{ message }}</h3>
	<button name="action" value="search">SEARCH</button>
        <button name="action" value="add">ADD</button>
        <button name="action" value="update">UPDATE</button>
        <button name="action" value="delete">DELETE</button>
		<br>
        <label>ISBN</label>
		<input type="number" name="isbn" required value="{{ book[0] if book else '' }}">
        <label>Title</label>
        <input type="text" name="title" value="{{ book[1] if book else '' }}">

        <label>Copyright</label>
        <input type="text" name="copyright" value="{{ book[2] if book else '' }}">

        <label>Edition</label>
        <input type="text" name="edition" value="{{ book[3] if book else '' }}">

        <label>Price</label>
        <input type="number" step="0.01" name="price" value="{{ book[4] if book else '' }}">

        <label>Quantity</label>
        <input type="number" name="quantity" value="{{ book[5] if book else '' }}">
		<h4>Notice!Search first the you can update.. </h4>
       
    </form>

   
</br>
    <h2>Book List</h2>

    <table>
        <tr>
            <th>ISBN</th>
            <th>Title</th>
            <th>Copyright</th>
            <th>Edition</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
        </tr>

        {% for b in books %}
        <tr>
            <td>{{ b[0] }}</td>
            <td>{{ b[1] }}</td>
            <td>{{ b[2] }}</td>
            <td>{{ b[3] }}</td>
            <td>{{ b[4] }}</td>
            <td>{{ b[5] }}</td>
            <td>{{ b[4] * b[5] }}</td>
        </tr>
        {% endfor %}
    </table>

    <h3>GRAND TOTAL: {{ total }}</h3>

</div>

</body>
</html>
