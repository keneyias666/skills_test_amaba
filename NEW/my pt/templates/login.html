{% extends 'base.html' %}
{% block content %}
<div class="w3-row-padding w3-margin-top">
	<div class="w3-col m4 l3"></div>
	<div class="w3-col m4 l6">
		<div class="w3-card-4 w3-round-large w3-padding-large">
			<h3 class="w3-center">Login</h3>
			<form method="POST">
				<p>
					<label><b>Username</b></label>
					<input type="text" name="username" class="w3-input" required>
				</p>
				<p>
					<label><b>Password</b></label>
					<input type="password" name="password" class="w3-input" required>
				</p>
				<p class="w3-center">
					<button type="submit" class="w3-button w3-blue w3-margin-right">Login</button>
					<a href="{{ url_for('signup') }}" class="w3-button w3-light-grey">Sign up</a>
				</p>
			</form>
		</div>
	</div>
</div>
{% endblock %}
