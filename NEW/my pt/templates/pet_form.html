{% extends "base.html" %}
{% block content %}
<div class="row">
  <div class="col-lg-6 mx-auto">
    <div class="card">
      <div class="card-body">
        <h2 class="h4 mb-3">
          {% if mode == "new" %}New Pet{% else %}Edit Pet{% endif %}
        </h2>
        <form method="post">
          {% if mode == "new" %}
          <div class="mb-3">
            <label class="form-label required">Pet ID</label>
            <input type="text" name="petID" class="form-control" value="{{ pet.petID or '' }}" required>
          </div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label required">Name</label>
            <input type="text" name="petName" class="form-control" value="{{ pet.petName or '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label required">Type</label>
            <input type="text" name="petType" class="form-control" value="{{ pet.petType or '' }}" placeholder="Dog, Cat, etc." required>
          </div>
          <div class="mb-3">
            <label class="form-label required">Sex</label>
            <select name="petSex" class="form-select" required>
              <option value="">Select</option>
              <option value="Male" {% if pet.petSex=='Male' %}selected{% endif %}>Male</option>
              <option value="Female" {% if pet.petSex=='Female' %}selected{% endif %}>Female</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label required">Birth Date (YYYY-MM-DD)</label>
            <input type="date" name="petBDate" class="form-control" value="{{ pet.petBDate or '' }}" max="{{ (caller_today if caller_today is defined else '') }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label required">Owner</label>
            <select name="petOwnerID" class="form-select" required>
              <option value="">Select owner</option>
              {% for o in owners %}
              <option value="{{ o.petOwnerID }}" {% if pet.petOwnerID==o.petOwnerID %}selected{% endif %}>
                {{ o.petOwnerID }} - {{ o.petOwnerFName }} {{ o.petOwnerLName }}
              </option>
              {% endfor %}
            </select>
          </div>
          <div class="d-flex justify-content-between">
            <a href="{{ url_for('pets_list') }}" class="btn btn-outline-secondary">Back</a>
            <button class="btn btn-primary" type="submit">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
