{% extends "base.html" %}
{% block content %}
<div class="row">
  <div class="col-lg-6 mx-auto">
    <div class="card">
      <div class="card-body">
        <h2 class="h4 mb-3">
          {% if mode == "new" %}New Veterinarian{% else %}Edit Veterinarian{% endif %}
        </h2>
        <form method="post">
          {% if mode == "new" %}
          <div class="mb-3">
            <label class="form-label required">License / Vet ID</label>
            <input type="text" name="vetID" class="form-control" value="{{ vet.vetID or '' }}" required>
          </div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label required">First Name</label>
            <input type="text" name="vetFName" class="form-control" value="{{ vet.vetFName or '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label required">Last Name</label>
            <input type="text" name="vetLName" class="form-control" value="{{ vet.vetLName or '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label required">Address</label>
            <textarea name="vetAddress" class="form-control" rows="2" required>{{ vet.vetAddress or '' }}</textarea>
          </div>
          <div class="mb-3">
            <label class="form-label required">Specialization</label>
            <input type="text" name="vetSpecial" class="form-control" value="{{ vet.vetSpecial or '' }}" required>
            <div class="form-text">Example: Small Animals, Surgery, Exotic Pets.</div>
          </div>
          <div class="d-flex justify-content-between">
            <a href="{{ url_for('vets_list') }}" class="btn btn-outline-secondary">Back</a>
            <button class="btn btn-primary" type="submit">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
